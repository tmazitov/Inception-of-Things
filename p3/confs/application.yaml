apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/tmazitov/tmazitov-iot-config.git
    targetRevision: HEAD
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true      # удалять из кластера то, что убрали из Git
      selfHeal: true   # откатывать ручные правки в кластере
    syncOptions:
      - CreateNamespace=true
